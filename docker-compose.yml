services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ourmusic-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ourmusic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ourmusic_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ourmusic}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ourmusic}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend - Bun + Elysia
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: ourmusic-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ourmusic}:${POSTGRES_PASSWORD:-ourmusic_secret}@postgres:5432/${POSTGRES_DB:-ourmusic}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_DELAY_MS: ${SPOTIFY_DELAY_MS:-500}
      ENABLE_CRON: ${ENABLE_CRON:-false}
      DISABLE_EMAILS: ${DISABLE_EMAILS:-true}
    ports:
      - "3000:3000"

  # Frontend - React + Vite (served by Nginx)
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
        VITE_AZURACAST_BASE_URL: ${VITE_AZURACAST_BASE_URL:-https://your-azuracast-instance.com}
        VITE_SITE_BASE_URL: ${VITE_SITE_BASE_URL:-http://localhost:8080}
    container_name: ourmusic-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:

networks:
  default:
    name: ourmusic-network
