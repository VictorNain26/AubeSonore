services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ourmusicbackend
    
    # Montages (code source et socket Docker)
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_USER_ID=${SPOTIFY_USER_ID}
      - PLAYLIST_PATH=/app/music
      - COOKIE_FILE=/app/music/youtube_cookies.txt
      - DOCKER_BUN_CONTAINER_NAME=ourmusic-backend
      - DOCKER_OTHER_CONTAINER_NAME=azuracast
      - SOURCE_MP3_PATH=/app/music
      - DESTINATION_MP3_PATH=/var/azuracast/stations/ourmusic/media
      - PORT=3000

    networks:
      - proxy_manager_default
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ourmusicfrontend
    
    volumes:
      - ./frontend:/app

    environment:
      - PORT=5173

    networks:
      - proxy_manager_default
networks:
  proxy_manager_default:
    external: true
