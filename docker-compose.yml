services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ourmusicbackend
    
    # Montages (code source et socket Docker)
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - azuracast_playlists_folder:/var/azuracast/stations/ourmusic/media/Playlists
    networks:
      - proxy_manager_default
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ourmusicfrontend
    
    volumes:
      - ./frontend:/app

    environment:
      - PORT=5173

    networks:
      - proxy_manager_default
networks:
  proxy_manager_default:
    external: true
volumes:
  azuracast_playlists_folder:
    external: true