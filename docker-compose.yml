services:
  backend:
    build:
      context: ./OurMusic-Backend
      dockerfile: Dockerfile
    container_name: ourmusicbackend
    ports:
      - "3001:3000"
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - azuracast_playlists_folder:/var/azuracast/stations/ourmusic/media/Playlists
    networks:
      - proxy_manager_default
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ourmusicfrontend
    volumes:
      - ./frontend:/app
    ports:
      - "3002:5173"
    networks:
      - proxy_manager_default
    restart: unless-stopped

networks:
  proxy_manager_default:
    external: true

volumes:
  azuracast_playlists_folder:
    external: true
