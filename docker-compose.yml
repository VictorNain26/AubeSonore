services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proxy_manager_default
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ourmusicbackend
    volumes:
      - ./OurMusic-Backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - azuracast_playlists_folder:/var/azuracast/stations/ourmusic/media/Playlists
    env_file:
      - ./OurMusic-Backend/.env
    depends_on:
      - db
    networks:
      - proxy_manager_default
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ourmusicfrontend
    volumes:
      - ./frontend:/app
    networks:
      - proxy_manager_default
    restart: always

volumes:
  postgres_data:
  azuracast_playlists_folder:
    external: true

networks:
  proxy_manager_default:
    external: true
