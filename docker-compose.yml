services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proxy_manager_default
    restart: unless-stopped

  backend:
    build:
      context: ./OurMusic-Backend
      dockerfile: Dockerfile
    container_name: ourmusicbackend
    ports:
      - "3001:3000"
    volumes:
      - ./OurMusic-Backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - azuracast_playlists_folder:/var/azuracast/stations/ourmusic/media/Playlists
    env_file:
      - ./OurMusic-Backend/.env
    depends_on:
      - db
    networks:
      - proxy_manager_default
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ourmusicfrontend
    ports:
      - "3002:5173"
    volumes:
      - ./frontend:/app
    networks:
      - proxy_manager_default
    restart: unless-stopped

volumes:
  postgres_data:
  azuracast_playlists_folder:
    external: true

networks:
  proxy_manager_default:
    external: true
