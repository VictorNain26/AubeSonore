name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.19"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check radio tests_radio
      - run: uv run ruff format --check radio tests_radio
      - run: uv run mypy
      - run: uv run pytest -q -W error
