name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Permissions needed for Vercel deployments
permissions:
  contents: read
  pull-requests: write
  deployments: write

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # Job 1: Detect which apps changed
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'packages/**'
            frontend:
              - 'apps/frontend/**'
              - 'packages/**'

  # Job 2: Quality checks (lint + typecheck)
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & Typecheck
        run: |
          pnpm turbo lint typecheck

      # Cache Turbo outputs for faster builds
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

  # Job 3: Build affected apps
  build:
    name: Build Apps
    needs: [changes, quality]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - name: Check if app changed
        id: changed
        run: echo "changed=${{ needs.changes.outputs[matrix.app] }}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        if: steps.changed.outputs.changed == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.changed.outputs.changed == 'true'
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.changed == 'true'
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Bun (for Backend)
        if: |
          steps.changed.outputs.changed == 'true' &&
          matrix.app == 'backend'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: steps.changed.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.changed.outputs.changed == 'true'
        run: pnpm turbo build --filter=@ourmusic/${{ matrix.app }}

  # Job 4: Deploy to Koyeb (Backend)
  deploy-koyeb:
    name: Deploy to Koyeb
    needs: [changes, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Koyeb CLI
        run: |
          curl -fsSL https://cli.koyeb.com/install.sh | sh
          sudo mv koyeb /usr/local/bin/

      - name: Deploy to Koyeb
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        run: |
          koyeb service redeploy ${{ secrets.KOYEB_BACKEND_SERVICE_ID }}

  # Job 5: Deploy to Vercel (Frontend)
  deploy-vercel:
    name: Deploy to Vercel
    needs: [changes, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
          working-directory: apps/frontend
          vercel-args: '--prod'
