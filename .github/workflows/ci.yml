name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.19"
          python-version: "3.12"
      # Outils audio de l'acquisition : le test d'intégration les fait tourner pour de vrai.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libchromaprint-tools rsgain
      # Modèle EffNet officiel, somme de contrôle épinglée dans radio/signals/audio.py.
      - run: |
          mkdir -p models
          curl -fsSL -o models/discogs-effnet-bs64-1.pb https://essentia.upf.edu/models/feature-extractors/discogs-effnet/discogs-effnet-bs64-1.pb
          echo "3ed9af50d5367c0b9c795b294b00e7599e4943244f4cbd376869f3bfc87721b1  models/discogs-effnet-bs64-1.pb" | sha256sum -c
      - run: uv sync --locked
      - run: uv run ruff check radio tests_radio
      - run: uv run ruff format --check radio tests_radio
      - run: uv run mypy
      - run: uv run pytest -q -W error -rs
