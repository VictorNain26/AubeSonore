<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Warm the connection to the media origin (audio stream + now-playing API
         + artwork, the likely LCP) so its TLS/DNS is ready before first paint. -->
    <link rel="preconnect" href="https://radio.aubesonore.fr" />

    <!-- SEO -->
    <title>AubeSonore — une radio de découverte, choisie titre par titre</title>
    <meta
      name="description"
      content="Une radio de découverte, choisie titre par titre. Gratuite. Sans publicité. Jour et nuit. Gardez ce qui vous arrête, retrouvez-le sur votre plateforme."
    />
    <meta name="author" content="AubeSonore" />
    <meta name="theme-color" content="#15151e" />
    <meta name="color-scheme" content="dark light" />
    <link rel="canonical" href="https://aubesonore.fr/" />

    <!-- Structured data — RadioStation + WebSite (schema.org).
         Improves understanding by Google Search, AI Overviews, Perplexity,
         ChatGPT search, Claude web. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@id": "https://aubesonore.fr/#org",
            "@type": "RadioStation",
            "name": "AubeSonore",
            "alternateName": "AubeSonore Webradio",
            "url": "https://aubesonore.fr/",
            "description": "Une radio de découverte, choisie titre par titre. Gratuite, sans publicité, en continu jour et nuit.",
            "logo": "https://aubesonore.fr/icons/icon-512x512.png",
            "image": "https://aubesonore.fr/icons/og-image.png",
            "inLanguage": "fr-FR",
            "broadcastDisplayName": "AubeSonore",
            "broadcastTimezone": "Europe/Paris",
            "potentialAction": {
              "@type": "ListenAction",
              "target": "https://radio.aubesonore.fr/listen/aubesonore/radio.mp3"
            }
          },
          {
            "@id": "https://aubesonore.fr/#site",
            "@type": "WebSite",
            "url": "https://aubesonore.fr/",
            "name": "AubeSonore",
            "inLanguage": "fr-FR",
            "publisher": { "@id": "https://aubesonore.fr/#org" }
          }
        ]
      }
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="AubeSonore — une radio de découverte, choisie titre par titre"
    />
    <meta
      property="og:description"
      content="Une radio de découverte, choisie titre par titre. Gratuite. Sans publicité. Jour et nuit. Gardez ce qui vous arrête, retrouvez-le sur votre plateforme."
    />
    <meta property="og:image" content="https://aubesonore.fr/icons/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AubeSonore" />
    <meta property="og:url" content="https://aubesonore.fr/" />
    <meta property="og:site_name" content="AubeSonore" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@aubesonore" />
    <meta name="twitter:creator" content="@aubesonore" />
    <meta
      name="twitter:title"
      content="AubeSonore — une radio de découverte, choisie titre par titre"
    />
    <meta
      name="twitter:description"
      content="Une radio de découverte, choisie titre par titre. Gratuite. Sans publicité. Jour et nuit. Gardez ce qui vous arrête, retrouvez-le sur votre plateforme."
    />
    <meta name="twitter:image" content="https://aubesonore.fr/icons/og-image.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <script>
      try {
        var stored = localStorage.getItem('aubesonore-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme =
          stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
        if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (_) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
