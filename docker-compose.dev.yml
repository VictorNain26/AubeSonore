# docker-compose.dev.yml - Environnement de développement
services:
  db:
    image: postgres:16-alpine
    container_name: ourmusic-db-dev
    environment:
      POSTGRES_USER: ${DB_USER:-ourmusic}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
      POSTGRES_DB: ${DB_NAME:-ourmusic_dev}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d  # Scripts d'init pour dev
    ports:
      - "5433:5432"  # Port différent pour éviter les conflits
    networks:
      - ourmusic_dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ourmusic} -d ${DB_NAME:-ourmusic_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./OurMusic-Backend
      dockerfile: Dockerfile.dev
      target: development
    container_name: ourmusic-backend-dev
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${DB_USER:-ourmusic}:${DB_PASSWORD:-ourmusic_password_2024}@db:5432/${DB_NAME:-ourmusic}
      - PORT=3000
      - BETTER_AUTH_SECRET=dev-secret-key-min-32-chars-long
      - BETTER_AUTH_URL=http://localhost:3001/api/auth
      - FRONTEND_BASE_URL=http://localhost:5174
      - BACKEND_BASE_URL=http://localhost:3001
      - ALLOWED_ORIGINS=http://localhost:5174,http://localhost:3000
      - ENABLE_CRON=false
    volumes:
      # Hot reload pour développement
      - ./OurMusic-Backend/src:/app/src:delegated
      - ./OurMusic-Backend/package.json:/app/package.json:ro
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ourmusic_dev
    ports:
      - "3001:3000"
      - "9229:9229"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./OurMusic-frontend
      dockerfile: Dockerfile.dev
      target: development
    container_name: ourmusic-frontend-dev
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:3001
      - VITE_AZURACAST_BASE_URL=http://localhost:8080
      - VITE_SITE_BASE_URL=http://localhost:5174
    volumes:
      # Hot reload pour développement
      - ./OurMusic-frontend/src:/app/src:delegated
      - ./OurMusic-frontend/public:/app/public:delegated
      - ./OurMusic-frontend/index.html:/app/index.html:ro
      - ./OurMusic-frontend/package.json:/app/package.json:ro
      - ./OurMusic-frontend/vite.config.ts:/app/vite.config.ts:ro
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - ourmusic_dev
    ports:
      - "5174:5173"
    restart: unless-stopped
    command: pnpm dev --host 0.0.0.0 --port 5173

  # Service utile pour développement
  adminer:
    image: adminer:4.8.1
    container_name: ourmusic-adminer-dev
    networks:
      - ourmusic_dev
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  postgres_dev_data:
    driver: local
  backend_node_modules:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  ourmusic_dev:
    driver: bridge
    name: ourmusic_dev_network