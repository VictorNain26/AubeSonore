# Development compose - only starts PostgreSQL
# Run backend and frontend locally with hot reload

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ourmusic-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ourmusic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ourmusic_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ourmusic}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ourmusic}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_dev:

networks:
  default:
    name: ourmusic-dev-network
