# docker-compose.prod.yml - Environnement de production
services:
  db:
    image: postgres:16-alpine
    container_name: ourmusic-db-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./database/backups:/backups  # Dossier pour sauvegardes
    networks:
      - ourmusic_internal
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Sécurité production
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  backend:
    build:
      context: ./OurMusic-Backend
      dockerfile: Dockerfile
      target: production
    container_name: ourmusic-backend-prod
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - PORT=3000
    env_file:
      - ./OurMusic-Backend/.env.prod
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ourmusic_internal
      - proxy_manager_default  # Pour reverse proxy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Sécurité production
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    user: "1000:1000"  # Non-root user
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  frontend:
    build:
      context: ./OurMusic-frontend
      dockerfile: Dockerfile
      target: production
    container_name: ourmusic-frontend-prod
    env_file:
      - ./OurMusic-frontend/.env.prod
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - proxy_manager_default
    restart: always
    # Sécurité production
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /var/log/nginx
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  # Service de monitoring (optionnel mais recommandé)
  watchtower:
    image: containrrr/watchtower:latest
    container_name: ourmusic-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 2 * * *  # 2h du matin chaque jour
      - WATCHTOWER_INCLUDE_STOPPED=true
    restart: always
    networks:
      - ourmusic_internal

  # Backup automatique de la DB
  db-backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: ourmusic-db-backup
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      SCHEDULE: "@daily"
    volumes:
      - ./database/backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ourmusic_internal
    restart: always

volumes:
  postgres_prod_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/ourmusic/data/postgres  # Stockage persistant

networks:
  ourmusic_internal:
    driver: bridge
    internal: true  # Réseau interne sécurisé
    name: ourmusic_internal
  proxy_manager_default:
    external: true  # Réseau externe pour reverse proxy