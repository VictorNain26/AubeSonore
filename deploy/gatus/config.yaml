# Surveillance de l'antenne AubeSonore (docs/vision.md §8.2). Référence : README de Gatus v5.37.0.
storage:
  type: sqlite
  path: /data/gatus.db

web:
  address: 127.0.0.1
  port: 8050

alerting:
  custom:
    # Les gabarits sont insérés dans l'URL sans encodage : noms d'endpoints sans espace.
    url: "https://api.callmebot.com/whatsapp.php?phone=${WHATSAPP_PHONE}&apikey=${CALLMEBOT_APIKEY}&text=AubeSonore%20:%20[ENDPOINT_NAME]%20[ALERT_TRIGGERED_OR_RESOLVED]"
    placeholders:
      ALERT_TRIGGERED_OR_RESOLVED:
        TRIGGERED: "en%20panne"
        RESOLVED: "revenu%20a%20la%20normale"
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

endpoints:
  - name: antenne
    group: radio
    url: "http://127.0.0.1:8080/api/nowplaying/aubesonore"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].is_online == true"
    alerts:
      - type: custom
        minimum-reminder-interval: 24h

  # Le flux ne finit jamais : aucune condition ne lit le corps, Gatus ne le lit donc pas.
  - name: flux-public
    group: radio
    url: "https://radio.aubesonore.fr/listen/aubesonore/radio.mp3"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        minimum-reminder-interval: 24h

  # Sans jeton Access, la page répond 403 : elle tourne. Le tunnel est couvert par flux-public.
  - name: page-de-vote
    group: radio
    url: "http://127.0.0.1:8040/"
    interval: 5m
    conditions:
      - "[STATUS] == 403"
    alerts:
      - type: custom
        minimum-reminder-interval: 24h

external-endpoints:
  - name: passe-hebdo
    group: radio
    token: "${GATUS_TOKEN}"
    heartbeat:
      interval: 192h
    alerts:
      - type: custom
        failure-threshold: 1
        minimum-reminder-interval: 24h
