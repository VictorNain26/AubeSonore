server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # SPA fallback - redirect all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (hashed at build time => safe immutable)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # ─────────────────────────────────────────────
    # Security headers
    # ─────────────────────────────────────────────
    # Clickjacking + MIME sniffing
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # TLS enforcement (assume TLS-terminating reverse proxy in prod)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Referer leakage + cross-origin isolation
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(), camera=(), geolocation=(), interest-cohort=()" always;

    # Content Security Policy
    # - script-src : self + gstatic (Google Cast SDK, injected at runtime)
    # - connect-src : SSE + REST against *.aubesonore.fr
    # - media-src   : MP3 stream from radio.aubesonore.fr
    # - img-src https: + data: to allow any AzuraCast art proxy and inline blobs
    # - style-src 'unsafe-inline' is required by Tailwind 4 dev injection and
    #   framer-motion's style attribute pattern (no scriptable XSS surface).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.aubesonore.fr wss://*.aubesonore.fr; media-src 'self' https://*.aubesonore.fr; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
}
