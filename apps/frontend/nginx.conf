server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    include /etc/nginx/snippets/security-headers.conf;

    # Artist pages are served by the backend so social crawlers get real
    # Open Graph tags. `^~` stops nginx from falling through to the regex
    # asset location below. The SPA still hydrates from the same HTML.
    location ^~ /artist/ {
        # Docker's embedded DNS. Resolving through a variable defers lookup to
        # request time: a literal upstream would make nginx refuse to start
        # whenever the backend is unreachable, taking the whole static site
        # down for one route. It also picks up a new backend IP after a
        # restart instead of caching the first one forever.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $artist_backend http://backend:3000;
        # With a variable, nginx no longer forwards the URI implicitly.
        proxy_pass $artist_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA fallback - redirect all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (hashed at build time => safe immutable).
    # The snippet is repeated here because the add_header below would
    # otherwise drop every security header inherited from the server block.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
