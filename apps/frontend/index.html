<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>AubeSonore - Webradio de Musique Indépendante</title>
    <meta
      name="description"
      content="AubeSonore est une webradio de découverte musicale indépendante. Écoutez gratuitement de la musique émergente et sauvegardez vos coups de coeur."
    />
    <meta name="author" content="AubeSonore" />
    <meta name="theme-color" content="#0f1118" />
    <link rel="canonical" href="https://aubesonore.fr/" />

    <!-- Structured data — RadioStation + WebSite (schema.org).
         Improves understanding by Google Search, AI Overviews, Perplexity,
         ChatGPT search, Claude web. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@id": "https://aubesonore.fr/#org",
            "@type": "RadioStation",
            "name": "AubeSonore",
            "alternateName": "AubeSonore Webradio",
            "url": "https://aubesonore.fr/",
            "description": "Webradio de découverte musicale indépendante. Diffusion continue de musique émergente, principalement francophone.",
            "logo": "https://aubesonore.fr/icons/icon-512x512.png",
            "image": "https://aubesonore.fr/icons/og-image.png",
            "inLanguage": "fr-FR",
            "broadcastDisplayName": "AubeSonore",
            "broadcastTimezone": "Europe/Paris",
            "potentialAction": {
              "@type": "ListenAction",
              "target": "https://radio.aubesonore.fr/listen/aubesonore/radio.mp3"
            }
          },
          {
            "@id": "https://aubesonore.fr/#site",
            "@type": "WebSite",
            "url": "https://aubesonore.fr/",
            "name": "AubeSonore",
            "inLanguage": "fr-FR",
            "publisher": { "@id": "https://aubesonore.fr/#org" }
          }
        ]
      }
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AubeSonore - Webradio de Musique Indépendante" />
    <meta
      property="og:description"
      content="Écoutez gratuitement de la musique émergente et sauvegardez vos coups de coeur sur AubeSonore."
    />
    <meta property="og:image" content="/icons/og-image.png" />
    <meta property="og:url" content="https://aubesonore.fr/" />
    <meta property="og:site_name" content="AubeSonore" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AubeSonore - Webradio de Musique Indépendante" />
    <meta
      name="twitter:description"
      content="Écoutez gratuitement de la musique émergente et sauvegardez vos coups de coeur."
    />
    <meta name="twitter:image" content="/icons/og-image.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- Chromecast SDK : injecté dynamiquement par src/lib/cast/loader.ts -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
