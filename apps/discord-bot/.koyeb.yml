# Koyeb Service Configuration for Discord Bot
# This file documents the Koyeb service configuration
# Actual deployment is done via GitHub Actions or Koyeb CLI

name: discord-bot
app: ourmusic

# Buildpack detection (Bun will be auto-detected)
build:
  context: ../..
  buildCommand: pnpm install --frozen-lockfile && pnpm turbo build --filter=@ourmusic/discord-bot

# Runtime configuration
runtime:
  startCommand: cd apps/discord-bot && bun run start
  # No HTTP port - Discord bot uses WebSocket

# Instance configuration
instance:
  type: eco-nano  # Free tier: 0.1 vCPU, 256MB RAM, 2GB SSD

# Scaling configuration
scaling:
  min: 1
  max: 1

# No health check for Discord bot (no HTTP server)

# Regions
regions:
  - fra  # Frankfurt, Germany

# Environment variables (configured in Koyeb dashboard or via GitHub secrets)
# DISCORD_BOT_TOKEN - Discord bot authentication token
# AZURACAST_SSE_URL - Azuracast SSE endpoint for real-time updates
# NODE_ENV - production
