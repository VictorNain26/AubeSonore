name: Production Android (Build & Submit)

on:
  push:
    branches:
      - main
      - master
    tags:
      - v*

jobs:
  build:
    name: Build Android AAB
    type: build
    params:
      platform: android
      profile: production

  submit:
    name: Submit to Play Store
    needs: [build]
    type: submit
    params:
      build_id: ${{ needs.build.outputs.build_id }}
