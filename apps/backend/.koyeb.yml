# Koyeb Service Configuration for Backend
# This file documents the Koyeb service configuration
# Actual deployment is done via GitHub Actions or Koyeb CLI

name: backend
app: ourmusic

# Buildpack detection (Bun will be auto-detected)
build:
  context: ../..
  buildCommand: pnpm install --frozen-lockfile && pnpm turbo build --filter=@ourmusic/backend

# Runtime configuration
runtime:
  startCommand: cd apps/backend && bun run start
  port: 3000

# Instance configuration
instance:
  type: eco-nano  # Free tier: 0.1 vCPU, 256MB RAM, 2GB SSD

# Scaling configuration
scaling:
  min: 1
  max: 1

# Health check
healthCheck:
  path: /health
  interval: 30
  timeout: 10

# Regions
regions:
  - fra  # Frankfurt, Germany

# Environment variables (configured in Koyeb dashboard or via GitHub secrets)
# DATABASE_URL - Neon PostgreSQL connection string
# SPOTIFY_CLIENT_ID - Spotify API client ID
# SPOTIFY_CLIENT_SECRET - Spotify API client secret
# ALLOWED_ORIGINS - CORS allowed origins
# ENABLE_CRON - Enable cron jobs (true/false)
# NODE_ENV - production
